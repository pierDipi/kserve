apiVersion: v1
kind: ServiceAccount
metadata:
  name: lm-eval-access
  labels:
    app.kubernetes.io/part-of: llminferenceservice
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: llminfereceservices-access
  labels:
    app.kubernetes.io/part-of: llminferenceservice
rules:
  - apiGroups: [ "serving.kserve.io" ]
    resources: [ "llminferenceservices" ]
    verbs: [ "get" ]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: lm-eval-llminfereceservices-access
  labels:
    app.kubernetes.io/part-of: llminferenceservice
subjects:
  - kind: ServiceAccount
    name: lm-eval-access
roleRef:
  kind: ClusterRole
  name: llminfereceservices-access
  apiGroup: rbac.authorization.k8s.io

