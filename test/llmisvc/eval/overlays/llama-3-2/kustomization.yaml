apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: Job
    patch: |-
      - op: replace
        path: /metadata/name
        value: "lm-eval-llama-3-2-3b-1"
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "llama-3-2-3b-1"
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "http://openshift-ai-inference-istio.openshift-ingress.svc.cluster.local/llm-test/llama-3-2-3b-1"
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: "gsm8k"
