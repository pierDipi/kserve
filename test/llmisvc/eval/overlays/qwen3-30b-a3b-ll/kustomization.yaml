apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - target:
      kind: Job
    patch: |-
      - op: replace
        path: /metadata/name
        value: "qwen3-30b-a3b-ll"
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: "Qwen/Qwen3-30B-A3B"
      - op: replace
        path: /spec/template/spec/containers/0/env/1/value
        value: "http://openshift-ai-inference-istio.openshift-ingress.svc.cluster.local/llm-test/qwen3-30b-a3b-ll"
      - op: replace
        path: /spec/template/spec/containers/0/env/2/value
        value: "gsm8k,mmlu_abstract_algebra,hellaswag,lambada_openai"
